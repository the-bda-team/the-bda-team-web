---
layout: base
nav_active: facilities
title: Edit BDA Database
breadcrumbs: [ "facilities", "database" ]
additional_css: [ "database" ]
---

<h1>Edit BDA Database</h1>

<div class="filter-box">
<input type="text" data-focus="true" placeholder="Type here to filter&hellip;" oninput="applySearchFilter(event)">
</div>

<div class="buttons">
<button id="add-new-button" type="button" onclick="addNewEntry()">Add new entry</button>
<button id="toggle-conversion-prompt" type="button" aria-expanded="false" aria-controls="conversion-prompt">Show conversion prompt</button>
</div>
<div id="conversion-prompt" aria-hidden="true">
<span class="element-actions" data-target="conversion-prompt">
<button class="icon" type="button" data-action="copy" title="copy">{% include icon/copy.svg %}</button>
</span>
<textarea></textarea>
</div>

<div id="entry-list" class="entry-list">Loading</div>

<footer>
<ul id="errors"></ul>
<div class="toolbar">
<div class="counters">
Edited: <span data-counter="edited">0</span>;
Added: <span data-counter="added">0</span>;
Deleted: <span data-counter="deleted">0</span>
</div>
<div class="buttons">
<button id="save-button" type="button" onclick="saveAll()">Save</button>
</div>
</footer>

<datalist id="autocomplete-keywords"></datalist>
<datalist id="autocomplete-authors-and-editors"></datalist>

<script src="{{ '/assets/js/api.js' | relative_url }}?{{site.time | date: '%s'}}"></script>
<script src="{{ '/assets/js/schemas.js' | relative_url }}?{{site.time | date: '%s'}}"></script>
<script src="{{ '/assets/js/database.js' | relative_url }}?{{site.time | date: '%s'}}"></script>
